<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Beni Affeder misin Balım? ❤️</title>

<style>
body {
    margin: 0;
    padding: 0;
    height: 100vh;
    overflow: hidden;
    font-family: "Comic Sans MS", cursive;
    text-align: center;

    /* ROMANTİK ARKA PLAN */
    background: linear-gradient(135deg, #ffb6d9, #ff92c7, #ffa3d1, #ff7ab8);
    background-size: 400% 400%;
    animation: bgMove 12s ease infinite;

    /* Kalp Deseni Overlay */
    position: relative;
}

body::before {
    content: "❤️ 💗 💕 💓 💞 💘";
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    font-size: 80px;
    opacity: 0.12;
    display: flex;
    justify-content: space-around;
    flex-wrap: wrap;
    pointer-events: none;
}

@keyframes bgMove {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

    body::before {
        content: "❤️ 💗 💕 💓 💞 💘";
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        font-size: 80px;
        opacity: 0.12;
        display: flex;
        justify-content: space-around;
        flex-wrap: wrap;
        pointer-events: none;
    }

    #question {
        font-size: 40px;
        font-weight: bold;
        margin-top: 40px;
        z-index: 5;
        position: relative;
    }

    button {
        font-size: 28px;
        padding: 10px 35px;
        margin: 20px;
        border: none;
        border-radius: 15px;
        cursor: pointer;
        font-weight: bold;
        position: relative;
        z-index: 5;
    }

    #yesBtn {
        background: #ff4fa3;
        color: white;
        transition: transform 0.2s ease;
    }

    #noBtn {
        background: #ffb4d4;
        color: white;
        position: relative;
    }

    /* Üzgün Ayı (giphy.gif) */
    #sadBear {
        position: absolute;
        top: 47%;
        left: 50%;
        transform: translate(-50%, -50%);
        max-width: 300px;
        z-index: 3;
    }

    /* Dans Eden Ayı (rabbittobi.gif) */
    #danceBear {
        position: absolute;
        top: 60%;
        left: 50%;
        transform: translateX(-50%);
        max-width: 300px;
        display: none;
        z-index: 20;
        animation: dance 1s infinite alternate;
    }

    @keyframes dance {
        0% { transform: translate(-50%, 0) rotate(0deg); }
        100% { transform: translate(-50%, -25px) rotate(10deg); }
    }

    /* Kalpler */
    .heart {
        position: absolute;
        bottom: 0;
        font-size: 30px;
        animation: floatUp 4s linear infinite;
    }

    @keyframes floatUp {
        0% { transform: translateY(0); opacity: 1; }
        100% { transform: translateY(-700px); opacity: 0; }
    }

    #loveMessage {
        font-size: 45px;
        font-weight: bold;
        display: none;
        margin-top: 80px;
        z-index: 30;
        position: relative;
    }

</style>
</head>

<body>

    <div id="question">Seni çok seviyorum... Beni affeder misin balım? ❤️</div>

    <button id="yesBtn">Evet</button>
    <button id="noBtn">Hayır</button>

    <!-- Üzgün Ayı -->
    <img id="sadBear" src="giphy.gif" alt="Üzgün Ayı">

    <!-- Dans Eden Ayı -->
    <img id="danceBear" src="rabbittobi.gif" alt="Dans Eden Ayı">

    <!-- Müzik -->
    <audio id="music" src="ati242.mp3"></audio>

    <div id="loveMessage">Affedeceğini biliyordum... Seni çoooook seviyorum balım ❤️</div>

<script>
    let noPressCount = 0;
    const yesBtn = document.getElementById("yesBtn");
    const noBtn = document.getElementById("noBtn");

    noBtn.addEventListener("click", () => {
        noPressCount++;

        yesBtn.style.transform = `scale(${1 + noPressCount * 0.25})`;

        if (noPressCount >= 10) {
            yesBtn.style.transform = "scale(20)";
        }
    });

    yesBtn.addEventListener("click", () => {
        document.getElementById("question").style.display = "none";
        yesBtn.style.display = "none";
        noBtn.style.display = "none";

        document.getElementById("sadBear").style.display = "none";

        document.getElementById("loveMessage").style.display = "block";

        document.getElementById("music").play();

        document.getElementById("danceBear").style.display = "block";

        setInterval(() => {
            const heart = document.createElement("div");
            heart.classList.add("heart");
            heart.innerHTML = "💖";
            heart.style.left = Math.random() * window.innerWidth + "px";
            document.body.appendChild(heart);

            setTimeout(() => heart.remove(), 4000);
        }, 300);
    });
</script>

</body>
</html>

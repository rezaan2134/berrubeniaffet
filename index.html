<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Berru'ya Özel ❤️</title>
<style>
    body {
        background: #ffd6e7;
        font-family: 'Comic Sans MS', cursive;
        text-align: center;
        margin: 0;
        overflow: hidden;
        position: relative;
    }

    h1 {
        color: #c40055;
        font-size: 36px;
        margin-top: 20px;
    }

    #buttons {
        margin-top: 30px;
        position: relative;
        z-index: 1;
    }

    button {
        font-size: 20px;
        padding: 10px 25px;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        margin: 10px;
        transition: all 0.3s ease;
        position: relative;
    }

    #yes {
        background-color: #ff4d8b;
        color: white;
    }

    #no {
        background-color: #aaa;
        color: white;
        position: absolute;
    }

    #message {
        margin-top: 40px;
        font-size: 26px;
        color: #c40055;
        font-weight: bold;
        display: none;
        position: relative;
        z-index: 1;
    }

    #bear {
        position: absolute;
        bottom: 50px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 100px;
    }

    .tear {
        position: absolute;
        color: #00f;
        font-size: 20px;
        animation: fall 2s linear forwards;
    }

    @keyframes fall {
        0% { transform: translateY(0); opacity: 1; }
        100% { transform: translateY(200px); opacity: 0; }
    }

    .bunny {
        position: absolute;
        font-size: 50px;
        animation: dance 1s infinite alternate;
    }

    @keyframes dance {
        0% { transform: translateY(0) rotate(0deg); }
        50% { transform: translateY(-20px) rotate(10deg); }
        100% { transform: translateY(0) rotate(-10deg); }
    }
</style>
</head>
<body>

<h1>Beni affeder misin? 🐻</h1>

<div id="buttons">
    <button id="yes">Evet</button>
    <button id="no">Hayır</button>
</div>

<div id="message">Affedeceğini biliyordum!<br>Seni çok seviyorum ❤️</div>

<div id="bear">🐻</div>

<!-- Müzik -->
<audio id="music" loop>
    <source src="ati242.mp3" type="audio/mpeg">
</audio>

<script>
    const noBtn = document.getElementById("no");
    const yesBtn = document.getElementById("yes");
    const bear = document.getElementById("bear");
    const music = document.getElementById("music");

    // Hayır tuşu kaçıyor
    noBtn.addEventListener("mouseover", () => {
        const x = Math.random() * (window.innerWidth - 100);
        const y = Math.random() * (window.innerHeight - 50);
        noBtn.style.left = x + "px";
        noBtn.style.top = y + "px";
    });

    // Gözyaşı oluştur
    function createTear() {
        const tear = document.createElement("div");
        tear.classList.add("tear");
        tear.textContent = "💧";
        tear.style.left = (bear.offsetLeft + 30 + Math.random()*40) + "px";
        tear.style.top = (bear.offsetTop + 20) + "px";
        document.body.appendChild(tear);
        setTimeout(() => tear.remove(), 2000);
    }

    // Sürekli gözyaşı
    setInterval(createTear, 800);

    // Evet tıklanınca
    yesBtn.addEventListener("click", () => {
        document.getElementById("message").style.display = "block";

        // Tavşan oluştur
        const bunny = document.createElement("div");
        bunny.classList.add("bunny");
        bunny.textContent = "🐰";
        bunny.style.left = (window.innerWidth/2 - 25) + "px";
        bunny.style.top = (window.innerHeight/2) + "px";
        document.body.appendChild(bunny);

        // Müziği çal
        music.play().catch(error => console.log("Müzik çalınamadı: ", error));
    });
</script>

</body>
</html>

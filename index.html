<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Berru'ya Özel ❤️</title>
<style>
    body {
        background: #ffd6e7;
        font-family: 'Comic Sans MS', cursive;
        margin: 0;
        overflow: hidden;
        text-align: center;
        position: relative;
        height: 100vh;
    }

    #header {
        position: absolute;
        top: 10%; /* GIF’in biraz üstünde */
        left: 50%;
        transform: translateX(-50%);
        z-index: 2;
    }

    h1 {
        color: #c40055;
        font-size: 50px;
        margin: 0 0 20px 0;
    }

    #buttons {
        z-index: 2;
        margin-top: 10px;
    }

    button {
        font-size: 30px;
        padding: 15px 35px;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        margin: 10px;
        transition: all 0.3s ease;
        position: relative;
    }

    #yes {
        background-color: #ff4d8b;
        color: white;
    }

    #no {
        background-color: #aaa;
        color: white;
    }

    #message {
        font-size: 50px;
        color: #c40055;
        font-weight: bold;
        display: none;
        position: absolute;
        top: 10%;
        left: 50%;
        transform: translateX(-50%);
        z-index: 3;
        text-align: center;
    }

    .heart {
        position: absolute;
        font-size: 25px;
        color: #ff4d8b;
        opacity: 0.7;
        pointer-events: none;
        user-select: none;
    }

    .floating {
        animation: floatUp linear infinite;
    }

    @keyframes floatUp {
        0% { transform: translateY(0) scale(1); opacity: 1; }
        100% { transform: translateY(-800px) scale(1.5); opacity: 0; }
    }

    .bunny {
        display: none;
        position: absolute;
        font-size: 100px;
        top: 60%;
        z-index: 4;
        animation: dance 1s ease-in-out infinite alternate;
    }

    @keyframes dance {
        0% { transform: translateY(0) rotate(0deg); }
        50% { transform: translateY(-20px) rotate(-15deg); }
        100% { transform: translateY(0) rotate(15deg); }
    }

    #bearGif {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 200px;
        z-index: 1;
    }
</style>
</head>
<body>

<div id="header">
    <h1 id="question">Beni affeder misin? 🐻</h1>
    <div id="buttons">
        <button id="yes">Evet</button>
        <button id="no">Hayır</button>
    </div>
</div>

<img id="bearGif" src="senin_gifin.gif" alt="Üzgün Ayı">

<div id="message">Affedeceğini biliyordum!<br>Seni çok seviyorum balım ❤️</div>

<audio id="music" loop>
    <source src="ati242.mp3" type="audio/mpeg">
</audio>

<script>
const yesBtn = document.getElementById("yes");
const noBtn = document.getElementById("no");
const music = document.getElementById("music");
const question = document.getElementById("question");
const buttons = document.getElementById("buttons");
const message = document.getElementById("message");
const bearGif = document.getElementById("bearGif");

// Tavşanları oluştur
const bunnies = [];
for (let i = 0; i < 5; i++) {
    const bunny = document.createElement("div");
    bunny.classList.add("bunny");
    bunny.textContent = "🐰";
    bunny.style.left = `${10 + i*18}%`;
    document.body.appendChild(bunny);
    bunnies.push(bunny);
}

// Evet butonunun başlangıç boyutu
let yesSize = 1;
let noClickCount = 0;

// Hayıra basıldıkça Evet büyüsün
noBtn.addEventListener("click", () => {
    noClickCount++;
    yesSize += 0.15;
    yesBtn.style.transform = `scale(${yesSize})`;

    if (noClickCount >= 10) {
        yesBtn.style.position = "absolute";
        yesBtn.style.top = "50%";
        yesBtn.style.left = "50%";
        yesBtn.style.transform = "translate(-50%, -50%) scale(30)";
        yesBtn.style.zIndex = "10";
    }
});

// Sabit kalpler
const staticHearts = [];
for (let i = 0; i < 50; i++) {
    const heart = document.createElement("div");
    heart.classList.add("heart");
    heart.textContent = "❤️";
    heart.style.left = Math.random() * window.innerWidth + "px";
    heart.style.top = Math.random() * window.innerHeight + "px";
    heart.style.fontSize = `${10 + Math.random()*30}px`;
    document.body.appendChild(heart);
    staticHearts.push(heart);
}

function floatHearts() {
    staticHearts.forEach(h => h.classList.add("floating"));
}

// Evet tuşuna basılınca
yesBtn.addEventListener("click", () => {
    document.getElementById("header").style.display = "none";
    bearGif.style.display = "none";
    message.style.display = "block";
    bunnies.forEach(b => b.style.display = "block");
    music.play().catch(e => console.log("Müzik çalınamadı", e));
    floatHearts();
});
</script>

</body>
</html>

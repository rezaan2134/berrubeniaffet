<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Beni Affeder misin Balım? ❤️</title>
<style>
body {
    margin:0;
    padding:0;
    height:100vh;
    overflow:hidden;
    font-family:"Comic Sans MS", cursive;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    background: #ffcad4;
    position:relative;
}

/* Arka plan kalpler */
.bg-heart {
    position:absolute;
    font-size:clamp(20px,5vw,60px);
    color: rgba(255, 0, 128, 0.2);
    animation: heartFloat 10s linear infinite;
}

@keyframes heartFloat {
    0% {transform: translateY(100vh) scale(0.5); opacity:0.3;}
    50% {opacity:0.6;}
    100% {transform: translateY(-10vh) scale(1); opacity:0;}
}

/* Soru yazısı üstte */
#question {
    font-size:clamp(22px,5vw,40px);
    font-weight:bold;
    position:absolute;
    top:calc(50% - 170px);
    left:50%;
    transform:translateX(-50%);
    z-index:5;
}

/* Butonlar GIF’in altında */
.button-container {
    position:absolute;
    top:calc(50% + 180px);
    left:50%;
    transform:translateX(-50%);
    z-index:5;
}

button {
    font-size:clamp(20px,5vw,32px);
    padding:10px 35px;
    margin:10px;
    border:none;
    border-radius:15px;
    cursor:pointer;
    font-weight:bold;
    transition:all 0.3s ease;
}
#yesBtn:hover {transform:scale(1.1); box-shadow:0 0 15px #ff4fa3;}
#noBtn:hover {transform:scale(1.1); box-shadow:0 0 15px #ffb4d4;}
#yesBtn {background:#ff4fa3; color:white;}
#noBtn {background:#ffb4d4; color:white;}

/* Ortadaki GIF / ayıcık */
#centerSticker {
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    width:clamp(150px,35vw,300px);
    z-index:10;
}

/* Dans eden ayı */
#danceBear {
    position:absolute;
    top:55%;
    left:50%;
    transform:translateX(-50%);
    width:clamp(150px,40vw,300px);
    display:none;
    z-index:20;
    animation:dance 1s infinite alternate;
}
@keyframes dance {
    0% {transform:translate(-50%,0) rotate(0deg);}
    100% {transform:translate(-50%,-20px) rotate(10deg);}
}

/* Uçan kalpler */
.heart {
    position:absolute;
    bottom:0;
    font-size:clamp(20px,6vw,40px);
    animation: floatUp 4s linear forwards;
}
@keyframes floatUp {
    0% {transform:translateY(0); opacity:1;}
    100% {transform:translateY(-70vh); opacity:0;}
}

/* Final mesaj */
#loveMessage {
    position:absolute;
    top:calc(50% + 180px);
    left:50%;
    transform:translateX(-50%);
    font-size:clamp(26px,6vw,45px);
    font-weight:bold;
    display:none;
    z-index:30;
    text-align:center;
    animation:pop 0.6s ease forwards;
}
@keyframes pop {
    0% {transform:scale(0.5); opacity:0;}
    100% {transform:scale(1); opacity:1;}
}
</style>
</head>
<body>

<div id="question">Seni çok seviyorum... Beni affeder misin balım? ❤️</div>

<img id="centerSticker" src="giphy.gif" alt="Ortadaki çıkartma">

<div class="button-container">
    <button id="yesBtn">Evet</button>
    <button id="noBtn">Hayır</button>
</div>

<img id="danceBear" src="rabbittobi.gif" alt="Dans Eden Ayı">
<audio id="music" src="ati242.mp3"></audio>
<div id="loveMessage">Affedeceğini biliyordum... Seni çoooook seviyorum balım ❤️</div>

<script>
// Arka plan kalpleri oluştur
for(let i=0;i<30;i++){
    const h = document.createElement("div");
    h.classList.add("bg-heart");
    h.innerHTML = "💖";
    h.style.left = Math.random()*window.innerWidth + "px";
    h.style.animationDelay = (Math.random()*10) + "s";
    h.style.fontSize = (20+Math.random()*40) + "px";
    document.body.appendChild(h);
}

let noPressCount = 0;
const yesBtn = document.getElementById("yesBtn");
const noBtn = document.getElementById("noBtn");
let heartInterval;

noBtn.addEventListener("click", () => {
    noPressCount++;
    yesBtn.style.transform = `scale(${1 + noPressCount*0.25})`;

    if(noPressCount >= 10){
        yesBtn.style.transform = "translate(-50%,-50%) scale(20)";
        yesBtn.style.position = "fixed";
        yesBtn.style.top = "50%";
        yesBtn.style.left = "50%";
        yesBtn.style.zIndex = "100";
        noBtn.style.display = "none";
        document.getElementById("question").style.display="none";
        document.getElementById("centerSticker").style.display="none";

        // 10.basışta kalpler Evet üstünden uçsun
        heartInterval = setInterval(() => {
            const heart = document.createElement("div");
            heart.classList.add("heart");
            heart.innerHTML = "💖";
            const rect = yesBtn.getBoundingClientRect();
            heart.style.left = rect.left + rect.width/2 + "px";
            document.body.appendChild(heart);
            setTimeout(()=>heart.remove(),4000);
        },200);
    }
});

yesBtn.addEventListener("click", () => {
    if(noPressCount < 10){ // normal Evet
        document.getElementById("question").style.display="none";
        document.getElementById("centerSticker").style.display="none";
        document.querySelector('.button-container').style.display="none";
        document.getElementById("loveMessage").style.display="block";
        document.getElementById("danceBear").style.display="block";
        document.getElementById("music").play();

        // normal uçan kalpler
        setInterval(() => {
            const heart = document.createElement("div");
            heart.classList.add("heart");
            heart.innerHTML = "💖";
            heart.style.left = Math.random()*window.innerWidth+"px";
            document.body.appendChild(heart);
            setTimeout(()=>heart.remove(),4000);
        },200);
    }
});
</script>

</body>
</html>

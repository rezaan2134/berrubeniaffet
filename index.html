<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Berru'ya Özel ❤️</title>
<style>
    body {
        background: #ffd6e7;
        font-family: 'Comic Sans MS', cursive;
        margin: 0;
        overflow: hidden;
        position: relative;
        text-align: center;
    }

    h1 {
        color: #c40055;
        font-size: 36px;
        margin-top: 20px;
        position: relative;
        z-index: 2;
    }

    #buttons {
        margin-top: 20px;
        position: relative;
        z-index: 2;
    }

    button {
        font-size: 20px;
        padding: 10px 25px;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        margin: 10px;
        transition: all 0.3s ease;
        position: relative;
    }

    #yes {
        background-color: #ff4d8b;
        color: white;
    }

    #no {
        background-color: #aaa;
        color: white;
        position: absolute;
    }

    #message {
        font-size: 32px;
        color: #c40055;
        font-weight: bold;
        display: none;
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: 3;
        text-align: center;
    }

    #bear {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: 120px;
        z-index: 1;
    }

    .tear {
        position: absolute;
        color: #00f;
        font-size: 20px;
        animation: fall 2s linear forwards;
    }

    @keyframes fall {
        0% { transform: translateY(0); opacity: 1; }
        100% { transform: translateY(250px); opacity: 0; }
    }

    .heart {
        position: absolute;
        font-size: 20px;
        color: #ff4d8b;
        animation: floatUp linear infinite;
        opacity: 0.8;
    }

    @keyframes floatUp {
        0% { transform: translateY(0) scale(1); opacity: 1; }
        100% { transform: translateY(-800px) scale(1.5); opacity: 0; }
    }
</style>
</head>
<body>

<h1 id="question">Beni affeder misin? 🐻</h1>

<div id="buttons">
    <button id="yes">Evet</button>
    <button id="no">Hayır</button>
</div>

<div id="bear">🐻</div>

<div id="message">Affedeceğini biliyordum!<br>Seni çok seviyorum balım ❤️</div>

<!-- Müzik -->
<audio id="music" loop>
    <source src="ati242.mp3" type="audio/mpeg">
</audio>

<script>
const noBtn = document.getElementById("no");
const yesBtn = document.getElementById("yes");
const bear = document.getElementById("bear");
const music = document.getElementById("music");
const question = document.getElementById("question");
const buttons = document.getElementById("buttons");
const message = document.getElementById("message");

// Hayır tuşu kaçıyor
noBtn.addEventListener("mouseover", () => {
    const x = Math.random() * (window.innerWidth - 100);
    const y = Math.random() * (window.innerHeight - 50);
    noBtn.style.left = x + "px";
    noBtn.style.top = y + "px";
});

// Gözyaşı oluştur
function createTear() {
    const tear = document.createElement("div");
    tear.classList.add("tear");
    tear.textContent = "💧";
    tear.style.left = (bear.offsetLeft + 30 + Math.random()*40) + "px";
    tear.style.top = (bear.offsetTop + 60) + "px";
    document.body.appendChild(tear);
    setTimeout(() => tear.remove(), 2000);
}
setInterval(createTear, 800);

// Kalp oluşturma
function createHeart() {
    const heart = document.createElement("div");
    heart.classList.add("heart");
    heart.textContent = "❤️";
    heart.style.left = Math.random() * window.innerWidth + "px";
    heart.style.fontSize = (10 + Math.random()*30) + "px";
    heart.style.animationDuration = (4 + Math.random()*4) + "s";
    document.body.appendChild(heart);
    setTimeout(() => heart.remove(), 8000);
}
setInterval(createHeart, 500);

// Evet tuşu tıklanınca
yesBtn.addEventListener("click", () => {
    // Soru, butonlar ve ayıcık kayboluyor
    question.style.display = "none";
    buttons.style.display = "none";
    bear.style.display = "none";

    // Mesaj ortada görünsün
    message.style.display = "block";

    // Tavşan GIF oluştur
    const bunnyGif = document.createElement("img");
    bunnyGif.src = "dancing_rabbit.gif"; // GIF dosyan aynı klasörde olmalı
    bunnyGif.style.position = "absolute";
    bunnyGif.style.left = (window.innerWidth/2 - 50) + "px";
    bunnyGif.style.top = (window.innerHeight/2 + 100) + "px";
    bunnyGif.style.width = "100px";
    bunnyGif.style.zIndex = "2";
    document.body.appendChild(bunnyGif);

    // Müziği çal
    music.play().catch(e => console.log("Müzik çalınamadı", e));
});
</script>

</body>
</html>

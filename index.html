<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Beni Affeder misin Balım? ❤️</title>

<style>
body {
    margin:0;
    padding:0;
    height:100vh;
    overflow:hidden;
    font-family:"Comic Sans MS", cursive;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    justify-content:flex-start;
    background: linear-gradient(135deg, #ffb6d9, #ff92c7, #ffa3d1, #ff7ab8);
    background-size:400% 400%;
    animation:bgMove 12s ease infinite;
    position:relative;
}
@keyframes bgMove {
    0% {background-position:0% 50%;}
    50% {background-position:100% 50%;}
    100% {background-position:0% 50%;}
}
body::before {
    content:"❤️ 💗 💕 💓 💞 💘";
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    font-size:8vw;
    opacity:0.12;
    display:flex;
    justify-content:space-around;
    flex-wrap:wrap;
    pointer-events:none;
}

#question {
    font-size:clamp(22px,5vw,40px);
    font-weight:bold;
    margin-top:5vh;
    z-index:5;
    width:90%;
}

button {
    font-size:clamp(20px,5vw,32px);
    padding:10px 35px;
    margin:20px;
    border:none;
    border-radius:15px;
    cursor:pointer;
    font-weight:bold;
    z-index:5;
    transition:all 0.3s ease;
}
#yesBtn:hover {transform:scale(1.1); box-shadow:0 0 15px #ff4fa3;}
#noBtn:hover {transform:scale(1.1); box-shadow:0 0 15px #ffb4d4;}
#yesBtn {background:#ff4fa3; color:white;}
#noBtn {background:#ffb4d4; color:white;}

#sadBear {
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-45%);
    width:clamp(120px,35vw,250px);
    z-index:3;
}

#danceBear {
    position:absolute;
    top:58%;
    left:50%;
    transform:translateX(-50%);
    width:clamp(150px,40vw,300px);
    display:none;
    z-index:20;
    animation:dance 1s infinite alternate;
}

@keyframes dance {
    0% {transform:translate(-50%,0) rotate(0deg);}
    100% {transform:translate(-50%,-20px) rotate(10deg);}
}

.heart {
    position:absolute;
    bottom:0;
    font-size:clamp(20px,6vw,40px);
    animation: floatUp 4s linear forwards, sparkle 1s ease-in-out infinite alternate;
}
@keyframes floatUp {
    0% {transform:translateY(0); opacity:1;}
    100% {transform:translateY(-70vh); opacity:0;}
}
@keyframes sparkle {
    0% {opacity:1; transform:scale(1);}
    50% {opacity:0.8; transform:scale(1.2);}
    100% {opacity:1; transform:scale(1);}
}

#loveMessage {
    font-size:clamp(26px,6vw,45px);
    font-weight:bold;
    display:none;
    margin-top:10vh;
    z-index:30;
    width:90%;
    animation:pop 0.6s ease forwards;
}
@keyframes pop {
    0% {transform:scale(0.5); opacity:0;}
    100% {transform:scale(1); opacity:1;}
}

.shake {animation: shakeAnim 0.5s infinite alternate;}
@keyframes shakeAnim {
    0% {transform:translate(-50%,-50%) rotate(0deg);}
    50% {transform:translate(-48%,-50%) rotate(-1deg);}
    100% {transform:translate(-52%,-50%) rotate(1deg);}
}

/* Ortadaki GIF / çıkartma */
#centerSticker {
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    width:clamp(150px,35vw,300px);
    z-index:10;
}
</style>
</head>
<body>

<div id="question">Seni çok seviyorum... Beni affeder misin balım? ❤️</div>
<button id="yesBtn">Evet</button>
<button id="noBtn">Hayır</button>

<!-- Ortadaki GIF sen ekleyeceksin -->
<img id="centerSticker" src="giphy.gif" alt="Ortadaki çıkartma">

<img id="danceBear" src="rabbittobi.gif" alt="Dans Eden Ayı">
<audio id="music" src="ati242.mp3"></audio>
<div id="loveMessage">Affedeceğini biliyordum... Seni çoooook seviyorum balım ❤️</div>

<script>
let noPressCount=0;
const yesBtn=document.getElementById("yesBtn");
const noBtn=document.getElementById("noBtn");

noBtn.addEventListener("click",()=>{
    noPressCount++;
    yesBtn.style.transform=`scale(${1+noPressCount*0.25})`;
    yesBtn.classList.add("shake");
    if(noPressCount>=10){
        yesBtn.style.transform="scale(20)";
        yesBtn.classList.remove("shake");
        noBtn.style.display="none";
    }
});

yesBtn.addEventListener("click",()=>{
    document.getElementById("question").style.display="none";
    yesBtn.style.display="none";
    noBtn.style.display="none";
    document.getElementById("centerSticker").style.display="none"; // Ortadaki GIF kaybolur
    document.getElementById("loveMessage").style.display="block";
    document.getElementById("danceBear").style.display="block";
    document.getElementById("music").play();

    // Uçan kalpler
    setInterval(()=>{
        const heart=document.createElement("div");
        heart.classList.add("heart");
        heart.innerHTML="💖";
        heart.style.left=`${Math.random()*window.innerWidth}px`;
        document.body.appendChild(heart);
        setTimeout(()=>heart.remove(),4000);
    },250);
});
</script>

</body>
</html>

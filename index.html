<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Berru'ya Özel ❤️</title>

<style>
    body {
        margin: 0;
        padding: 0;
        height: 100vh;
        background: #ffd6e7;
        overflow: hidden;
        font-family: "Comic Sans MS", cursive;
        text-align: center;
    }

    /* Üstteki başlık ve butonlar */
    #header {
        position: absolute;
        top: 10%;
        left: 50%;
        transform: translateX(-50%);
        z-index: 2;
    }

    h1 {
        font-size: 50px;
        color: #c40055;
        margin: 0 0 20px 0;
    }

    button {
        font-size: 30px;
        padding: 15px 40px;
        border: none;
        border-radius: 12px;
        cursor: pointer;
        margin: 10px;
        transition: 0.3s;
    }

    #yes { background: #ff4d8b; color: white; }
    #no { background: #7d7d7d; color: white; }

    /* Mesaj */
    #message {
        font-size: 55px;
        color: #c40055;
        display: none;
        position: absolute;
        top: 12%;
        left: 50%;
        transform: translateX(-50%);
        z-index: 5;
    }

    /* GIF - SEN KOYACAKSIN */
    #bearGif {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        max-width: 50vw;
        max-height: 50vh;
        width: auto;
        height: auto;
        z-index: 1;
    }

    /* Sabit kalpler */
    .heart {
        position: absolute;
        color: #ff4d8b;
        opacity: 0.7;
        font-size: 20px;
        pointer-events: none;
    }

    /* Uçan kalpler */
    .floating {
        animation: floatUp 3s linear infinite;
    }

    @keyframes floatUp {
        from { transform: translateY(0) scale(1); opacity: 1; }
        to { transform: translateY(-600px) scale(1.5); opacity: 0; }
    }

    /* Dans eden tavşanlar */
    .bunny {
        display: none;
        position: absolute;
        font-size: 90px;
        top: 60%;
        animation: dance 1s infinite alternate;
        z-index: 5;
    }

   </style>
</head>

<body>

<div id="header">
    <h1 id="question">Beni affeder misin? 🐻</h1>
    <button id="yes">Evet</button>
    <button id="no">Hayır</button>
</div>

<!-- AYICIK GİFİ - SEN KOYACAKSIN -->
<img id="bearGif" src="giphy.gif" alt="Üzgün Ayı">
<img id="danceBear" src="rabbittobi.gif" alt="Dans Eden Ayı">

<div id="message">Affedeceğini biliyordum!<br>Seni çok seviyorum balım ❤️</div>

<audio id="music" loop>
    <source src="ati242.mp3" type="audio/mpeg">
</audio>

<script>
const yesBtn = document.getElementById("yes");
const noBtn = document.getElementById("no");
const message = document.getElementById("message");
const header = document.getElementById("header");
const bearGif = document.getElementById("bearGif");
const music = document.getElementById("music");

/* Tavşanlar */
    const b = document.createElement("div");
    b.className = "bunny";
    b.textContent = "🐰";
    b.style.left = (10 + i * 18) + "%";
    document.body.appendChild(b);
    bunnies.push(b);
}

/* Sabit kalpler */
const hearts = [];
for (let i = 0; i < 60; i++) {
    const h = document.createElement("div");
    h.className = "heart";
    h.textContent = "❤️";
    h.style.left = Math.random() * 100 + "vw";
    h.style.top = Math.random() * 100 + "vh";
    h.style.fontSize = (10 + Math.random()*30) + "px";
    document.body.appendChild(h);
    hearts.push(h);
}

/* Hayıra basıldıkça evet büyüsün */
let yesScale = 1;
let noCount = 0;

noBtn.addEventListener("click", () => {
    noCount++;
    yesScale += 0.15;
    yesBtn.style.transform = `scale(${yesScale})`;

    if (noCount >= 10) {
        yesBtn.style.position = "absolute";
        yesBtn.style.left = "50%";
        yesBtn.style.top = "50%";
        yesBtn.style.transform = "translate(-50%, -50%) scale(30)";
        yesBtn.style.zIndex = "10";
    }
});

/* Evet'e basınca */
yesBtn.addEventListener("click", () => {
    header.style.display = "none";
    bearGif.style.display = "none";
    message.style.display = "block";

    bunnies.forEach(b => b.style.display = "block");

    music.play().catch(()=>{});

    hearts.forEach(h => h.classList.add("floating"));
});
</script>

</body>
</html>

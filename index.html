<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Berru'ya Özel ❤️</title>
<style>
    body {
        background: #ffd6e7;
        font-family: 'Comic Sans MS', cursive;
        margin: 0;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        justify-content: center; /* Dikey ortalama */
        align-items: center;    /* Yatay ortalama */
        height: 100vh;
        text-align: center;
        position: relative;
    }

    h1 {
        color: #c40055;
        font-size: 36px;
        margin: 10px 0;
        z-index: 2;
        position: relative;
    }

    #buttons {
        z-index: 2;
        position: relative;
        margin: 10px 0;
    }

    button {
        font-size: 20px;
        padding: 10px 25px;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        margin: 10px;
        transition: all 0.3s ease;
    }

    #yes {
        background-color: #ff4d8b;
        color: white;
    }

    #no {
        background-color: #aaa;
        color: white;
    }

    #message {
        font-size: 32px;
        color: #c40055;
        font-weight: bold;
        display: none;
        z-index: 3;
        text-align: center;
    }

    #bear {
        position: absolute;
        font-size: 120px;
        z-index: 1;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
    }

    .tear {
        position: absolute;
        color: #00f;
        font-size: 20px;
        animation: fall 2s linear forwards;
    }

    @keyframes fall {
        0% { transform: translateY(0); opacity: 1; }
        100% { transform: translateY(250px); opacity: 0; }
    }

    .heart {
        position: absolute;
        font-size: 20px;
        color: #ff4d8b;
        opacity: 0.7;
        pointer-events: none;
        user-select: none;
    }

    .floating {
        animation: floatUp linear infinite;
    }

    @keyframes floatUp {
        0% { transform: translateY(0) scale(1); opacity: 1; }
        100% { transform: translateY(-800px) scale(1.5); opacity: 0; }
    }

    #bunny {
        display: none;
        position: absolute;
        font-size: 80px;
        left: 50%;
        transform: translateX(-50%);
        top: 60%;
        z-index: 4;
        animation: dance 1s ease-in-out infinite alternate;
    }

    @keyframes dance {
        0% { transform: translateX(-50%) translateY(0) rotate(0deg); }
        50% { transform: translateX(-50%) translateY(-20px) rotate(-15deg); }
        100% { transform: translateX(-50%) translateY(0) rotate(15deg); }
    }
</style>
</head>
<body>

<h1 id="question">Beni affeder misin? 🐻</h1>

<div id="buttons">
    <button id="yes">Evet</button>
    <button id="no">Hayır</button>
</div>

<div id="bear">🐻</div>

<div id="bunny">🐰</div>

<div id="message">Affedeceğini biliyordum!<br>Seni çok seviyorum balım ❤️</div>

<audio id="music" loop>
    <source src="ati242.mp3" type="audio/mpeg">
</audio>

<script>
const yesBtn = document.getElementById("yes");
const noBtn = document.getElementById("no");
const bear = document.getElementById("bear");
const music = document.getElementById("music");
const question = document.getElementById("question");
const buttons = document.getElementById("buttons");
const message = document.getElementById("message");
const bunny = document.getElementById("bunny");

// Evet butonunun başlangıç boyutu
let yesSize = 1;

// Hayıra basıldıkça Evet büyüsün
noBtn.addEventListener("click", () => {
    yesSize += 0.1;
    yesBtn.style.transform = `scale(${yesSize})`;
});

// Gözyaşı oluştur
function createTear() {
    const tear = document.createElement("div");
    tear.classList.add("tear");
    tear.textContent = "💧";
    tear.style.left = (bear.offsetLeft + 30 + Math.random()*40) + "px";
    tear.style.top = (bear.offsetTop + 60) + "px";
    document.body.appendChild(tear);
    setTimeout(() => tear.remove(), 2000);
}
setInterval(createTear, 800);

// Sayfa açıldığında sabit kalpler oluştur
const staticHearts = [];
for (let i = 0; i < 50; i++) {
    const heart = document.createElement("div");
    heart.classList.add("heart");
    heart.textContent = "❤️";
    heart.style.left = Math.random() * window.innerWidth + "px";
    heart.style.top = Math.random() * window.innerHeight + "px";
    heart.style.fontSize = (10 + Math.random()*30) + "px";
    document.body.appendChild(heart);
    staticHearts.push(heart);
}

// Evet tuşuna basıldığında kalpleri uçur
function floatHearts() {
    staticHearts.forEach(h => h.classList.add("floating"));
}

// Evet tuşuna basılınca
yesBtn.addEventListener("click", () => {
    question.style.display = "none";
    buttons.style.display = "none";
    bear.style.display = "none";

    message.style.display = "block";
    bunny.style.display = "block";

    music.play().catch(e => console.log("Müzik çalınamadı", e));

    floatHearts();
});
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Berru'ya Özel ❤️</title>

<style>
    body {
        margin: 0;
        padding: 0;
        height: 100vh;
        background: #ffd6e7;
        overflow: hidden;
        font-family: "Comic Sans MS", cursive;
        text-align: center;
        transition: background 2s ease;
    }

    /* EKRAN KARARMA */
    body.fade {
        background: black !important;
    }

    #header, #message, #bearGif, #specialGif, .heart {
        transition: opacity 1s ease;
    }

    .hidden {
        opacity: 0;
    }

    #header {
        position: absolute;
        top: 10%;
        left: 50%;
        transform: translateX(-50%);
        z-index: 5;
    }

    h1 {
        font-size: 50px;
        color: #c40055;
        margin: 0 0 20px 0;
    }

    button {
        font-size: 30px;
        padding: 15px 40px;
        border: none;
        border-radius: 12px;
        cursor: pointer;
        margin: 10px;
        transition: 0.3s;
    }

    #yes { background: #ff4d8b; color: white; }
    #no { background: #7d7d7d; color: white; }

    #message {
        font-size: 55px;
        color: #c40055;
        display: none;
        position: absolute;
        top: 12%;
        left: 50%;
        transform: translateX(-50%);
        z-index: 5;
    }

    #bearGif {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        max-width: 50vw;
        max-height: 50vh;
        z-index: 1;
    }

    /* Rabbitobi GIF */
    #specialGif {
        display: none;
        position: absolute;
        top: 60%;
        left: 50%;
        transform: translate(-50%, -50%);
        max-width: 30vw;
        max-height: 30vh;
        z-index: 5;
    }

    .heart {
        position: absolute;
        color: #ff4d8b;
        opacity: 0.7;
        font-size: 20px;
        pointer-events: none;
    }

    .floating {
        animation: floatUp 3s linear infinite;
    }

    @keyframes floatUp {
        from { transform: translateY(0) scale(1); opacity: 1; }
        to { transform: translateY(-600px) scale(1.5); opacity: 0; }
    }

    /* FOTOĞRAF FİNAL SAHNESİ */
    #photosContainer {
        display: none;
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: 20;
        width: 100vw;
        height: 100vh;
        text-align: center;
    }

    .photo {
        display: none;
        max-width: 90vw;
        max-height: 90vh;
        border-radius: 20px;
        box-shadow: 0 0 20px white;
        opacity: 0;
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        transition: opacity 2s ease; /* YUMUŞAK GEÇİŞ */
    }

    .photo.active {
        display: block;
        opacity: 1;
    }

    /* FINAL MESAJ */
    #finalMessage {
        display: none;
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: white;
        font-size: 60px;
        text-align: center;
        z-index: 30;
        animation: fadeIn 3s forwards;
    }

    @keyframes fadeIn {
        from { opacity: 0; }
        to   { opacity: 1; }
    }
</style>
</head>

<body>

<div id="header">
    <h1 id="question">Beni affeder misin? 🐻</h1>
    <button id="yes">Evet</button>
    <button id="no">Hayır</button>
</div>

<img id="bearGif" src="giphy.gif">
<img id="specialGif" src="rabbittobi.gif">

<div id="message">Affedeceğini biliyordum!<br>Seni çok seviyorum balım ❤️</div>

<!-- 5 FOTOĞRAF -->
<div id="photosContainer">
    <img src="foto1.jpg" class="photo">
    <img src="foto2.jpg" class="photo">
    <img src="foto3.jpg" class="photo">
    <img src="foto4.jpg" class="photo">
    <img src="foto5.jpg" class="photo">
</div>

<div id="finalMessage">HEPİNİZİ ÇOK SEVİYORUM<br>HİÇ BIRAKMAYACAĞIM ❤️</div>

<audio id="music" loop>
    <source src="ati242.mp3" type="audio/mpeg">
</audio>

<script>
const yesBtn = document.getElementById("yes");
const noBtn = document.getElementById("no");
const message = document.getElementById("message");
const header = document.getElementById("header");
const bearGif = document.getElementById("bearGif");
const music = document.getElementById("music");
const specialGif = document.getElementById("specialGif");
const finalMessage = document.getElementById("finalMessage");

/* Sabit kalpler */
const hearts = [];
for (let i = 0; i < 60; i++) {
    const h = document.createElement("div");
    h.className = "heart";
    h.textContent = "❤️";
    h.style.left = Math.random() * 100 + "vw";
    h.style.top = Math.random() * 100 + "vh";
    h.style.fontSize = (10 + Math.random()*30) + "px";
    document.body.appendChild(h);
    hearts.push(h);
}

/* Hayır'a basıldıkça Evet büyür */
let yesScale = 1;
let noCount = 0;

noBtn.addEventListener("click", () => {
    noCount++;
    yesScale += 0.15;
    yesBtn.style.transform = `scale(${yesScale})`;

    if (noCount >= 10) {
        yesBtn.style.position = "absolute";
        yesBtn.style.left = "50%";
        yesBtn.style.top = "50%";
        yesBtn.style.transform = "translate(-50%, -50%) scale(30)";
    }
});

/* EVET'e basınca */
yesBtn.addEventListener("click", () => {
    header.style.display = "none";
    bearGif.style.display = "none";
    message.style.display = "block";

    specialGif.style.display = "block";
    music.play().catch(()=>{});

    hearts.forEach(h => h.classList.add("floating"));

    startFinalScene();
});

/* --------- FINAL SCENE --------- */
function startFinalScene() {
    setTimeout(() => {

        /* Her şeyi sil */
        header.classList.add("hidden");
        message.classList.add("hidden");
        bearGif.classList.add("hidden");
        specialGif.classList.add("hidden");
        hearts.forEach(h => h.classList.add("hidden"));

        /* Ekranı karart */
        document.body.classList.add("fade");

        /* Fotoğrafları aç */
        document.getElementById("photosContainer").style.display = "block";
        showPhotos();

    }, 3000);
}

/* FOTOĞRAFLARI TEK TEK YUMUŞAK GEÇİŞLE GÖSTER */
function showPhotos() {
    const photos = document.querySelectorAll(".photo");
    let index = 0;

    photos[0].classList.add("active");

    const interval = setInterval(() => {
        photos[index].classList.remove("active");
        index++;

        if (index >= photos.length) {
            clearInterval(interval);
            setTimeout(showFinalMessage, 2000);
            return;
        }

        photos[index].classList.add("active");

    }, 3500);
}

/* FİNAL YAZISI */
function showFinalMessage() {
    finalMessage.style.display = "block";
}
</script>

</body>
</html>
